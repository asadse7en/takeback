name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Download Windows ExifTool distribution
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "exiftool-windows.zip"
          $extract = Join-Path $env:RUNNER_TEMP "exiftool-windows"
          $destination = "src-tauri/binaries/exiftool/${{ matrix.target }}"
          Invoke-WebRequest `
            -Uri "https://sourceforge.net/projects/exiftool/files/exiftool-13.63_64.zip/download" `
            -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $distribution = Get-ChildItem $extract -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
          if ($null -eq $distribution) {
            throw "ExifTool executable was not found in the downloaded distribution."
          }
          Copy-Item $distribution.FullName (Join-Path $destination "exiftool.exe")
          $support = Join-Path $distribution.DirectoryName "exiftool_files"
          if (!(Test-Path $support)) {
            throw "ExifTool support directory was not found in the downloaded distribution."
          }
          Copy-Item $support $destination -Recurse

      - name: Download Perl ExifTool distribution
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="$RUNNER_TEMP/Image-ExifTool-13.63.tar.gz"
          curl --fail --location --silent --show-error \
            "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-13.63.tar.gz/download" \
            --output "$archive"
          mkdir -p "src-tauri/binaries/exiftool/$TARGET"
          tar -xzf "$archive" -C "src-tauri/binaries/exiftool/$TARGET"

      - name: Build and attach release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Takeback ${{ github.ref_name }}
          releaseBody: Installers for Windows, macOS, and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
