[package]
name = "takeback"
version = "0.1.0"
description = "Takeback app"
authors = ["Copilot"]
license = "MIT"
repository = "https://example.com/takeback"
edition = "2021"

[lib]
name = "takeback_lib"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.0"
blake3 = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tzf-rs = "2.3.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3.16"
image = "0.25"
sysinfo = "0.31"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-fs = "2.7.0"
tauri-plugin-shell = "2.6.0"
tauri-plugin-opener = "2.7.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
