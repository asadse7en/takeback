ical-align:-1px"></span>{{ freeAfter }} free after</span></div></div></div><div><div class="card"><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="12" height="10" rx="2"/><path d="M5 3h11a2 2 0 012 2v9"/></svg></span><div class="t">Albums<div class="d">{{ albumHelp }}</div></div><div class="sg2"><button class="{{ a_albumMode_off }}" onClick="{{ s_albumMode_off }}">Off</button><button class="{{ a_albumMode_move }}" onClick="{{ s_albumMode_move }}">Move</button><button class="{{ a_albumMode_link }}" onClick="{{ s_albumMode_link }}">Link</button><button class="{{ a_albumMode_copy }}" onClick="{{ s_albumMode_copy }}">Copy</button></div></div><div class="row " style="min-height:42px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 11h2M11 11h2M7 14h2"/></svg></span><div class="t">Date folders</div><div class="sg2"><button class="{{ a_dateFolders_off }}" onClick="{{ s_dateFolders_off }}">Off</button><button class="{{ a_dateFolders_year }}" onClick="{{ s_dateFolders_year }}">Year</button><button class="{{ a_dateFolders_month }}" onClick="{{ s_dateFolders_month }}">Year › Month</button></div></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2L10 14.3 5.4 16.8l.9-5.2L2.5 8l5.2-.7z"/></svg></span><div class="t">Favorites<div class="d">1,032 starred photos found</div></div><div class="sg2"> flex:1;overflow-y:auto;min-height:0"><sc-for list="{{ lines }}" as="line" hint-placeholder-count="12"><div class="ln"><sc-for list="{{ line.guides }}" as="g" hint-placeholder-count="1"><div class="gc {{ g.c }}"></div></sc-for><div class="lc"><sc-if value="{{ line.isFolder }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6l2 2h8v9H2z"/></svg><span class="fn">{{ line.name }}</span></sc-if><sc-if value="{{ line.isFile }}" hint-placeholder-val="{{ false }}"><span class="fl">{{ line.name }}</span></sc-if><sc-if value="{{ line.hasTag }}" hint-placeholder-val="{{ false }}"><span class="tag">{{ line.tag }}</span></sc-if></div></div></sc-for></div></div></div></div></div>
<div class="ft"><label style="display:flex;gap:10px;align-items:center"><span style="width:18px;height:18px;border:1.5px solid #8C8479;border-radius:4px;display:inline-block"></span>Preview only</label><div style="display:flex;gap:8px"><button class="btn">Back</button><button class="btn ac">Start</button></div></div>

" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l1-4L14 3l3 3L7 16z"/></svg></span><div class="t">Folder names<div class="d">Favorites, Archive, Edited, Unsorted</div></div><button class="btn">Rename</button></div></div></sc-if><sc-if value="{{ show_names }}" hint-placeholder-val="{{ false }}"><div class="card"><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"/></svg></span><div class="t">File names<div class="d">Example: IMG_4821.jpg</div></div><div class="dd" style="width:176px;font-size:13px">Keep original<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#6B6359" stroke-width="1.4" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></div></div><div class="row " style="min-height:42px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 4H5a2 2 0 00-2 2v8"/></svg></span><div class="t">If two files have the same name</div><div class="dd" style="width:176px;font-size:13px">Add a number<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#6B6359" stroke-width="1.4" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></div></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 4H5a2 2 0 00-2 2v8"/></svg></span><div class="t">Ignore exact duplicates<div class="d">Compared by content, also against files already in the output</div></div><button class="tg {{ c_dups }}" onClick="{{ t_dups }}" aria-label="dups"><i></i></button></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h7l3 3v13H5z"/><path d="M8 10h4M8 13h4"/></svg></span><div class="t">Files without JSON<div class="d">128 files found</div></div><div class="sg2 "><button class="{{ a_noJson_leave }}" onClick="{{ s_noJson_leave }}">Leave in place</button><button class="{{ a_noJson_uns }}" onClick="{{ s_noJson_uns }}">Unsorted folder</button></div></div></div></sc-if><sc-if value="{{ show_dates }}" hint-placeholder-val="{{ false }}"><div class="card"><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 5v5l3 2"/></svg></span><div class="t">Time zone<div class="d">Local = where the photo was taken</div></div><div class="sg2 "><button class="{{ a_timeZone_local }}" onClick="{{ s_timeZone_local }}">Local</button><button class="{{ a_timeZone_computer }}" onClick="{{ s_timeZone_computer }}">Computer</button><button class="{{ a_timeZone_utc }}" onClick="{{ s_timeZone_utc }}">UTC</button></div></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 11h2M11 11h2M7 14h2"/></svg></span><div class="t">If a photo has no date<div class="d">Used when there is no JSON or EXIF date</div></div><div class="sg2 "><button class="{{ a_noDate_name }}" onClick="{{ s_noDate_name }}">File name</button><button class="{{ a_noDate_file }}" onClick="{{ s_noDate_file }}">File date</button><button class="{{ a_noDate_none }}" onClick="{{ s_noDate_none }}">Leave blank</button></div></div><div class="row " style="min-height:42px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 18s6-5.5 6-10a6 6 0 10-12 0c0 4.5 6 10 6 10z"/><circle cx="10" cy="8" r="2"/></svg></span><div class="t">Write location (GPS)</div><button class="tg {{ c_gps }}" onClick="{{ t_gps }}" aria-label="gps"><i></i></button></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M6 8h8M6 12h5"/></svg></span><div class="t">Write descriptions and people tags<div class="d">From Google Photos</div></div><button class="tg {{ c_descr }}" onClick="{{ t_descr }}" aria-label="descr"><i></i></button></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5l2.3 4.8 5.2.7-3.8 3.6.9 5.2L10 14.3 5.4 16.8l.9-5.2L2.5 8l5.2-.7z"/></svg></span><div class="t">Rate favorites 5 stars<div class="d">Shows as 5 stars in Windows Explorer and other apps</div></div><button class="tg {{ c_rating }}" onClick="{{ t_rating }}" aria-label="rating"><i></i></button></div></div></sc-if><sc-if value="{{ show_more }}" hint-placeholder-val="{{ false }}"><div class="card"><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M7 10h6"/></svg></span><div class="t">Live photo style<div class="d">Experimental: iPhone and Android change the photo file</div></div><div class="sg2 "><button class="{{ a_liveStyle_sep }}" onClick="{{ s_liveStyle_sep }}">Separate</button><button class="{{ a_liveStyle_iphone }}" onClick="{{ s_liveStyle_iphone }}">iPhone</button><button class="{{ a_liveStyle_android }}" onClick="{{ s_liveStyle_android }}">Android</button></div></div><div class="row " style="min-height:44px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></span><div class="t">Delete each zip after it is processed<div class="d">Frees space as it goes. Permanent: asks you to confirm.</div></div><button class="tg {{ c_deleteZips }}" onClick="{{ t_deleteZips }}" aria-label="deleteZips"><i></i></button></div><div class="row " style="min-height:42px;padding:4px 16px"><span class="ri"><svg class="ic" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#B8530A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15a7 7 0 1114 0"/><path d="M10 15l3-5"/></svg></span><div class="t">Speed</div><div class="sg2 "><button class="{{ a_speed_bal }}" onClick="{{ s_speed_bal }}">Balanced</button><button class="{{ a_speed_gentle }}" onClick="{{ s_speed_gentle }}">Gentle on my PC</button></div></div></div></sc-if></div><div style="display:flex;justify-content:flex-end;padding:12px 18px;border-top:1px solid #E8E2DA;background:#F6F3EF;border-radius:0 0 8px 8px"><button class="btn ac" onClick="{{ closeAdv }}">Done</button></div></div></div></sc-if><sc-if value="{{ show_confirm }}" hint-placeholder-val="{{ false }}"><div class="bd" style="background:rgba(31,27,22,.5)"><div class="dlg" style="width:480px"><div style="padding:18px 20px 6px"><b style="font-size:18px;font-weight:600">Delete each zip after it is processed?</b></div><div style="padding:0 20px 16px;color:#6B6359;line-height:20px">Each Takeout file is permanently deleted once its photos are saved and checked. It does not go to the Recycle Bin or Trash. To run Takeback again you would need to download your Takeout again. Your Google Photos library is not affected.</div><div style="display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid #E8E2DA;background:#F6F3EF;border-radius:0 0 8px 8px"><button class="btn" onClick="{{ confirmOff }}">Cancel</button><button class="btn ac" onClick="{{ confirmOn }}">Delete zips as I go</button></div></div></div></sc-if>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) { this.state = Object.assign({}, this.state, o); window.__rerender(); }
}
(function () {
  var holeRe = /\{\{\s*([^}]+?)\s*\}\}/g;
  function ev(expr, scope) {
    expr = String(expr).trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    var parts = expr.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function holeOnly(s) { var m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(s || ''); return m ? m[1] : null; }
  function interp(s, scope) {
    return s.replace(holeRe, function (m, e) { var v = ev(e, scope); return v == null || typeof v === 'function' ? '' : String(v); });
  }
  function kids(node, scope, out) { node.childNodes.forEach(function (c) { render(c, scope, out); }); }
  function render(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-if') { var c = holeOnly(node.getAttribute('value')); if (c !== null ? ev(c, scope) : node.getAttribute('value')) kids(node, scope, out); return; }
    if (tag === 'sc-for') {
      var l = holeOnly(node.getAttribute('list')), as = node.getAttribute('as'), arr = (l !== null ? ev(l, scope) : null) || [];
      arr.forEach(function (item) { var sc = Object.assign({}, scope); sc[as] = item; kids(node, sc, out); });
      return;
    }
    var el = document.createElementNS(node.namespaceURI, node.localName);
    Array.prototype.forEach.call(node.attributes, function (a) {
      if (a.name.indexOf('hint-') === 0) return;
      if (a.name === 'onclick') { var h = holeOnly(a.value); var fn = h !== null ? ev(h, scope) : null; if (typeof fn === 'function') el.addEventListener('click', fn); return; }
      el.setAttribute(a.name, interp(a.value, scope));
    });
    kids(node, scope, el);
    out.appendChild(el);
  }
  window.__boot = function (Component) {
    var comp = new Component({}), root = document.getElementById('root');
    var t = document.createElement('template'); t.innerHTML = document.getElementById('tpl').textContent;
    window.__rerender = function () {
      var frag = document.createDocumentFragment(), vals = comp.renderVals();
      t.content.childNodes.forEach(function (n) { render(n, vals, frag); });
      root.replaceChildren(frag);
    };
    window.__rerender();
  };
})();


class Component extends DCLogic {
renderVals() {
const D = {folder:0,albumMode:'move',albumLoc:'top',dateFolders:'month',copyAll:'first',timeZone:'local',noDate:'name',merge:true,splitPhoto:false,splitVideo:false,splitLive:false,archive:true,favMode:'link',editedMode:'move',edVer:'both',trash:'skip',noJson:'uns',dups:true,gps:true,descr:true,rating:true,liveStyle:'sep',deleteZips:false,speed:'bal'};
const s = Object.assign({}, D, {adv:false,tab:'folders'}, this.state || {});
const set = (k, v) => () => this.setState({[k]: v});
const tog = (k) => () => this.setState({[k]: !s[k]});
const root = [{n:'Photo Library',p:'C:\\Users\\You\\Pictures\\Photo Library',g:'Drive C:',us:'100 GB',fa:'281 GB',u:19.5,nw:25.6},{n:'My Photos',p:'D:\\My Photos',g:'Drive D:',us:'160 GB',fa:'709 GB',u:16,nw:13.1},{n:'Photo Library',p:'D:\\Backup\\Photo Library',g:'Drive D:',us:'160 GB',fa:'709 GB',u:16,nw:13.1}][s.folder];
const albumHelp = {off:'No album folders, everything sorted by date',move:'Each photo lives in its first album, the rest by date',link:'Originals stay by date, albums hold links',copy:'Originals stay by date, albums hold copies'}[s.albumMode];
const SPECIAL = ['Archive','Favorites','Edited','Trash','Unsorted'];
const mk = (name) => ({name, kids: [], files: [], rank: SPECIAL.indexOf(name) >= 0 ? 1 : 0});
const top = mk(root.n);
const items = [
{n:'IMG_4821.jpg',t:'photo',al:['Paris trip','Best of 2024'],hasEd:1,y:'2024',m:'06'},
{n:'PXL_0612.jpg',t:'live',al:['Paris trip'],y:'2024',m:'06'},
{n:'VID_0099.mp4',t:'video',al:[],y:'2024',m:'06'},
{n:'IMG_4900.jpg',t:'photo',al:[],fav:1,y:'2024',m:'06'},
{n:'IMG_3100.jpg',t:'photo',al:[],arch:1,y:'2024',m:'03'},
{n:'IMG_4821-edited.jpg',t:'photo',al:['Paris trip'],ed:1,y:'2024',m:'06'},
{n:'IMG_0201.jpg',t:'photo',al:[],trashed:1,y:'2023',m:'11'},
{n:'IMG_0099.jpg',t:'photo',al:[],nojson:1,y:'2022',m:'01'}];
const add = (path, it, tag) => {
let nd = top;
path.forEach((p) => { let c = nd.kids.find((x) => x.name === p); if (!c) { c = mk(p); nd.kids.push(c); } nd = c; });
nd.files.push({name: it.n, tag: tag || (it.t === 'live' ? 'Live' : '')});
};
const typ = (it) => it.t === 'photo' ? 'Photos' : it.t === 'video' ? 'Videos' : 'Live photos';
const sp = (p, it) => (it.t === 'photo' ? s.splitPhoto : it.t === 'video' ? s.splitVideo : s.splitLive) ? p.concat([typ(it)]) : p;
const cap = (x) => x === 'link' ? 'Link' : 'Copy';
items.forEach((it) => {
if (it.ed && s.edVer === 'orig') return;
if (it.hasEd && s.edVer === 'edit') return;
if (it.trashed && s.trash === 'skip') return;
if (it.nojson) { if (s.noJson === 'uns') add(['Unsorted'], it, ''); return; }
const yp = s.dateFolders === 'month' ? [it.y, it.m] : s.dateFolders === 'year' ? [it.y] : [];
const ap = (a) => s.albumLoc === 'year' ? [it.y, a] : [a];
let main = sp(yp, it);
const extra = [];
if (s.albumMode === 'move' && it.al.length) {
main = sp(ap(it.al[0]), it);
if (s.copyAll === 'all') it.al.slice(1).forEach((a) => extra.push([sp(ap(a), it), 'Copy']));
} else if ((s.albumMode === 'link' || s.albumMode === 'copy') && it.al.length) {
it.al.forEach((a) => extra.push([sp(ap(a), it), cap(s.albumMode)]));
}
if (it.arch && s.archive) main = ['Archive'];
if (it.trashed && s.trash === 'own') main = ['Trash'];
if (it.fav && s.favMode !== 'off') { if (s.favMode === 'move') main = ['Favorites']; else extra.push([['Favorites'], cap(s.favMode)]); }
if (it.ed && s.editedMode !== 'off') { if (s.editedMode === 'move') main = ['Edited']; else extra.push([['Edited'], cap(s.editedMode)]); }
add(main, it, '');
extra.forEach((e) => add(e[0], it, e[1]));
});
const lines = [];
const L = (o) => lines.push(Object.assign({isFolder: false, isFile: false, name: '', guides: [], hasTag: false, tag: ''}, o));
const guidesFor = (flags, d, last) => { if (d === 0) return []; const g = flags.slice(0, d - 1).map((l) => ({c: l ? '' : 'v'})); g.push({c: last ? 'l' : 't'}); return g; };
const walk = (nd, d, flags, last) => {
let name = nd.name; let cur = nd;
while (d > 0 && cur.kids.length === 1 && cur.files.length === 0) { cur = cur.kids[0]; name += ' \u203a ' + cur.name; }
L({isFolder: true, name: name, guides: guidesFor(flags, d, last)});
const ch = cur.kids.slice().sort((a, b) => a.rank - b.rank).map((k) => ({k: k})).concat(cur.files.map((f) => ({f: f})));
const nf = d === 0 ? flags : flags.concat([last]);
ch.forEach((c, i) => {
const l = i === ch.length - 1;
if (c.k) walk(c.k, d + 1, nf, l);
else L({isFile: true, name: c.f.name, guides: guidesFor(nf, d + 1, l), hasTag: !!c.f.tag, tag: c.f.tag});
});
};
walk(top, 0, [], true);
const advKeys = ['albumLoc','copyAll','editedMode','trash','noJson','dups','gps','descr','rating','liveStyle','deleteZips','speed','timeZone','noDate'];
const changed = advKeys.filter((k) => s[k] !== D[k]).length;
const o = {lines, pathText: root.p, drive: root.g, usedTxt: root.us, freeAfter: root.fa, usedW: root.u, needW: root.nw,
advSummary: changed ? changed + ' changed from the defaults' : 'All defaults',
browse: () => this.setState({folder: (s.folder + 1) % 3}),
d_albumLoc: s.albumMode === 'off' ? 'dis' : '', d_copyAll: s.albumMode === 'move' ? '' : 'dis', d_editedMode: s.edVer !== 'orig' ? '' : 'dis',
albumHelp: albumHelp, show_adv: s.adv, openAdv: () => this.setState({adv: true}), closeAdv: () => this.setState({adv: false})};
['archive','merge','dups','gps','descr','rating','deleteZips','splitPhoto','splitVideo','splitLive'].forEach((k) => { o['c_' + k] = s[k] ? 'on' : ''; o['t_' + k] = tog(k); o['a_' + k] = s[k] ? 'a' : ''; });
[['albumMode',['off','move','link','copy']],['dateFolders',['off','year','month']],['albumLoc',['top','year']],['timeZone',['local','computer','utc']],['noDate',['name','file','none']],['favMode',['off','move','link','copy']],['editedMode',['off','move','link','copy']],['edVer',['both','orig','edit']],['trash',['skip','incl','own']],['noJson',['leave','uns']],['liveStyle',['iphone','android','sep']],['copyAll',['first','all']],['speed',['bal','gentle']]].forEach((g) => g[1].forEach((v) => { o['a_' + g[0] + '_' + v] = s[g[0]] === v ? 'a' : ''; o['s_' + g[0] + '_' + v] = set(g[0], v); }));
['folders','names','dates','more'].forEach((k) => { o['show_' + k] = s.tab === k; o['tb_' + k] = s.tab === k ? 'sel' : ''; o['go_' + k] = set('tab', k); });
o.liveOn = s.merge; o.liveTag = {iphone:'iPhone style', android:'Android style', sep:'Separate files'}[s.liveStyle];
o.show_confirm = !!s.confirmDel; o.confirmOn = () => this.setState({deleteZips: true, confirmDel: false}); o.confirmOff = () => this.setState({confirmDel: false});
o.t_deleteZips = () => { if (s.deleteZips) this.setState({deleteZips: false}); else this.setState({confirmDel: true}); };
return o;
}
}

__boot(Component);
</script>
